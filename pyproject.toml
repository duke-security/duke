[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duke-security"
version = "0.1.0"
description = "A vendor-agnostic cybersecurity education and security-engineering platform."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Umar Gambari" }]
keywords = [
    "cybersecurity",
    "education",
    "security-engineering",
    "MITRE-ATT&CK",
    "detection-engineering",
    "python-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Security",
]
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
duke = "duke.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duke = ["scenarios/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["duke"]
explicit_package_bases = true
namespace_packages = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# The reusable conformance helpers, fixtures, and probe callables are checked
# under full strict mode. The thin pytest *drivers* under the same package are
# exempt from the untyped-definition/typed-context rules so existing test
# conventions do not have to be migrated, while the code they exercise stays
# fully typed and strict-checked.
[[tool.mypy.overrides]]
module = [
    "conformance.test_declaration",
    "conformance.test_registry",
    "conformance.test_behavioural",
    "conformance.test_production",
    "conformance.builtin_pairs",
    "tests.conformance.test_declaration",
    "tests.conformance.test_registry",
    "tests.conformance.test_behavioural",
    "tests.conformance.test_production",
]
disable_error_code = ["no-untyped-def", "no-untyped-call", "type-arg"]

[tool.coverage.run]
source = ["duke"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
